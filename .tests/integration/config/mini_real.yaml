# Mini Real Dataset — small committed bin/csv recordings for smoke testing
# Usage: NEURODENT_DATASET=mini_real snakemake --cores 1

temp_directory: "/tmp/neurodent_mini_real"

samples:
  samples_file: ".tests/integration/config/samples_mini_real.json"

analysis:
  war_generation:
    pattern:
      - "{data_root}/{animal}/{index}_ColMajor.bin"
      - "{data_root}/{animal}/{index}_Meta.csv"
    assume_from_number: true
    lro_kwargs:
      mode: "si"
      extract_func: "tests/integration/readers.py:read_bin_csv_pair"
      multiprocess_mode: "serial"

cluster:
  war_generation:
    retries: 0
