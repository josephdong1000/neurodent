# Mini Real Dataset — small committed bin/csv recordings for smoke testing
# Usage: NEURODENT_DATASET=mini_real snakemake --cores all

temp_directory: "/tmp/neurodent_mini_real"

analysis:
  war_generation:
    pattern:
      - "{data_root}/{animal}/{index}_ColMajor.bin"
      - "{data_root}/{animal}/{index}_Meta.csv"
    lro_kwargs:
      mode: "si"
      extract_func: "neurodent.readers:read_bin_csv_pair"
      multiprocess_mode: "serial"

cluster:
  war_generation:
    retries: 0

# --- Data inventory (channels + per-animal entries) ---
samples_data:
  data_root: .tests/integration/data
  channels:
    # read_bin_csv_pair keys identity on the port-qualified ProbeInfo column, so the
    # bin fixture presents "Intan Input (1)/PortC C-015". The bare forms are kept as
    # aliases because the same fixture ships an EDF twin whose header labels are bare.
    LMot:
    - C-015
    - Intan Input (1)/PortC C-015
    - D-015
    - Intan Input (1)/PortD D-015
    RMot:
    - C-016
    - Intan Input (1)/PortC C-016
    - D-016
    - Intan Input (1)/PortD D-016
    LBar:
    - C-014
    - Intan Input (1)/PortC C-014
    - D-014
    - Intan Input (1)/PortD D-014
    RBar:
    - C-017
    - Intan Input (1)/PortC C-017
    - D-017
    - Intan Input (1)/PortD D-017
    LHip:
    - C-012
    - Intan Input (1)/PortC C-012
    - D-012
    - Intan Input (1)/PortD D-012
    RHip:
    - C-019
    - Intan Input (1)/PortC C-019
    - D-019
    - Intan Input (1)/PortD D-019
    LAud:
    - C-009
    - Intan Input (1)/PortC C-009
    - D-009
    - Intan Input (1)/PortD D-009
    RAud:
    - C-022
    - Intan Input (1)/PortC C-022
    - D-022
    - Intan Input (1)/PortD D-022
    LVis:
    - C-010
    - Intan Input (1)/PortC C-010
    - D-010
