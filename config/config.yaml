# NeuRodent Snakemake Pipeline Configuration
# =====================================

# Dataset selection
# Set NEURODENT_DATASET environment variable or change active_dataset below
# Dataset configs are in config/datasets/{dataset_name}.yaml
active_dataset: "sox5_bin"

# Core directories and paths
temp_directory: "/scr1/users/dongjp"

# Sample configuration
# Note: the per-dataset samples inventory is inlined under `samples_data` in each
# config/datasets/{active_dataset}.yaml (deep-merged in by the Snakefile).
samples:
  # Limit to first N animals (null = no limit, useful for testing)
  truncate_animals: null

  # Quality filtering parameters
  quality_filter:
    exclude_unknown_genotypes: true
    exclude_bad_animaldays: true

# Analysis parameters
analysis:
  # WAR generation parameters
  # Note: mode, file_pattern, and some lro_kwargs are set by active_dataset (see datasets section above)
  # The settings below are shared across all datasets or serve as defaults
  war_generation:
    skip_sessions: ["*bad*"]
    lro_kwargs:
      multiprocess_mode: "dask"
    compute_windowed_analysis:
      features: ["all"]             # Feature list; "all" computes every supported feature
      multiprocess_mode: "dask"     # "dask" (parallel) or "serial"
      chunk_duration_s: 3600           # seconds of data to buffer at a time (null = single bulk allocation, fast but high RAM)

  # Frequency domain spike detection parameters
  frequency_domain_spike_detection:
    # Default detection parameters
    default_params:
      bp: [3.0, 40.0]              # bandpass filter Hz [low, high]
      notch: 60.0                  # notch filter Hz
      notch_q: 30.0                # notch filter quality factor
      freq_slices: [10.0, 20.0]    # STFT energy slices Hz [freq1, freq2, ...]
      sneo_percentile: 99.99       # SNEO threshold percentile (higher = fewer detections)
      cluster_gap_ms: 80.0         # minimum gap between spikes (ms)
      search_ms: 160.0             # spike refinement search window (ms)
      baseline_ms: 500.0           # baseline analysis window (ms)
      k_sigma: 3.0                 # statistical significance threshold (sigma)
      smooth_window: 7             # smoothing kernel size for spike refinement
      vote_k: 2                    # minimum votes required across frequency bands
      smooth_len: 5                # SNEO smoothing window length

    # Processing parameters
    multiprocess_mode: "dask"    # "dask" or "serial"
    chunk_duration_s: 3600           # seconds per chunk for spike detection (null = load full recording at once)

    # .fif export parameters
    export_chunk_duration_s: 3600    # seconds per chunk when reading traces to write .fif (lower = less RAM but more NFS round-trips)

    # Visualization parameters
    spike_averaged_traces:
      tmin: -0.5                   # epoch start time (seconds)
      tmax: 0.5                    # epoch end time (seconds)
      baseline: null               # baseline correction period [tmin, tmax] or null
      save_epochs: true            # whether to save epoch data (.fif files)
      figure_format: "png"         # output format for plots
      dpi: 300                     # figure resolution

  # WAR standardization parameters (channel setup applied before filtering)
  standardization:
    # Channel order/target derives from constants.CHANNEL_ABBREVS (the canonical channel
    # list, set per-dataset via samples_data `channels`). Add
    # `channel_reorder: [...]` here only to override that order for a dataset.
    use_abbrevs: true
    add_unique_hash: false  # Whether to add unique hash during standardization
    unique_hash_length: 4   # Length of unique hash if enabled

  # Fragment filtering configuration (temporal artifact removal)
  fragment_filter_config:
    logrms_range:
      z_range: 3
    high_rms:
      max_rms: 500
    low_rms:
      min_rms: 50
    high_beta:
      max_beta_prop: 0.4
    # morphological_smoothing:
    #   smoothing_seconds: 300  # Uncomment to enable temporal smoothing

  # Channel filtering configurations (spatial artifact removal)
  channel_filter_config:
    manual:
      # Channels rejected for ALL animals (opt-in; empty by default). Per-session
      # bad_channels declared in the dataset config always apply on top of this.
      reject_channels: []
      min_valid_channels: 3
    lof:
      reject_lof_threshold: 2.5  # LOF threshold above which channels are considered bad
      reject_channels: []  # List of channels to reject globally
      min_valid_channels: 3
      lof_chunk_duration_s: 60  # seconds per chunk for pairwise-distance computation in LOF

  # Data aggregation parameters (applied after filtering)
  aggregation:
    groupby: ["animalday", "isday"]  # Time window grouping for aggregation

  # Zeitgeber time processing parameters
  zeitgeber:
    features: ["logpsdband", "logpsdfrac", "logrms", "logampvar",
               "logpsdtotal", "lognspike", "psdslope",
               "zpcorr", "zcohere", "zimcoh"]
    time_aggregation_minutes: 60  # Time window for aggregation (60 = hourly)

  # Zeitgeber temporal plots parameters
  zeitgeber_plots:
    features: ["logpsdband", "logpsdfrac", "logrms", "logampvar",
               "logpsdtotal", "lognspike", "psdslope",
               "zpcorr", "zcohere", "zimcoh"]
    baseline_hours: 12  # Hours to use for baseline correction (first N hours)
    exclude_from_baseline: []  # Optional: features to exclude from baseline correction (e.g., ["logrms", "zcohere_delta"])
    figure_format: "png"  # Figure output format: png, tif, pdf, svg
    data_format: "csv"    # Data export format: csv, pkl
    dpi: 300             # Figure resolution
    figsize: [10, 20]    # Figure size [width, height]

  # Relative frequency distribution plots parameters
  relfreq_plots:
    features: ["nspike", "lognspike", "pcorr", "zpcorr", "cohere", "zcohere", "imcoh", "zimcoh", "logpsdfrac", "logpsdband", "psdband"]
    figure_format: "png"  # Figure output format: png, tif, pdf, svg
    data_format: "csv"    # Data export format: csv, pkl
    dpi: 300             # Figure resolution

  # ExperimentPlotter statistical figures parameters
  ep_figures:
    features: ["rms", "ampvar", "psdtotal", "nspike",
               "logrms", "logampvar", "logpsdtotal", "lognspike",
               "psdband", "psdfrac", "logpsdband", "logpsdfrac",
               "cohere", "zcohere", "imcoh", "zimcoh",
               "pcorr", "zpcorr", "psd"]
    exclude_features: null  # Features to exclude from ExperimentPlotter
    figure_format: "png"  # Figure output format: png, tif, pdf, svg
    data_format: "csv"    # Data export format: csv, pkl
    dpi: 300             # Figure resolution

  # ExperimentPlotter heatmap parameters  
  ep_heatmaps:
    matrix_features: ["cohere", "imcoh", "zcohere", "zimcoh", "pcorr", "zpcorr"]
    baseline_type: "sex_specific"  # "sex_specific" (e.g., MWT, FWT) or "global" (single baseline)
    figure_format: "png"  # Figure output format: png, tif, pdf, svg
    data_format: "pkl"    # Data export format: csv, pkl (heatmaps typically use pkl)
    dpi: 300             # Figure resolution

  # LOF accuracy evaluation parameters
  lof_evaluation:
    threshold_range:
      min: 0.5            # Minimum LOF threshold to test
      max: 4.0            # Maximum LOF threshold to test
      step: 0.05           # Step size for threshold testing
    # Subset of channels to evaluate. Defaults to constants.CHANNEL_ABBREVS (the canonical
    # channel list) when omitted; set `evaluation_channels: [...]` to restrict it.
    evaluation_channels: []
    figure_format: "png"  # Figure output format: png, tif, pdf, svg
    data_format: "csv"    # Data export format: csv, pkl
    dpi: 300             # Figure resolution

  # Filtering comparison parameters (manual vs LOF channel filtering)
  filtering_comparison:
    features_to_compare: ["rms", "logpsdband", "psdslope", "logpsdfrac", "logpsdtotal", "zpcorr", "zcohere", "zimcoh"]
    plot_types: ["feature_scatter", "channel_impact", "animal_correlation"]
    # NOTE these features below should be explored later
    # baseline_type: "manual"  # Use manual filtering as baseline
    # figure_format: "png"
    # data_format: "csv"
    # dpi: 300

  # Figure generation parameters
  figures:
    coherecorr_spectral:
      figsize: [20, 5]
      score_type: "z"
    
    psd_histogram:
      figsize: [10, 4]
      avg_channels: true
      plot_type: "loglog"
    
    psd_spectrogram:
      figsize: [20, 4]
      mode: "none"
    
    # Temporal heatmap parameters - configurable features with individual parameters
    temporal_heatmaps:
      features:
        rms:
          figsize: [10, 3]
          cmap: "viridis"
          norm_type: "fixed"
          norm_params: 
            vmin: 50
            vmax: 300
        psdslope:
          figsize: [10, 3]
          cmap: "viridis"
          norm_type: "fixed"      # default norm = the slope component's scale
          norm_params:
            vmin: -3
            vmax: 0
          component_norms:        # per-component overrides (slope uses norm_params above)
            intercept:
              norm_type: "fixed"
              norm_params:
                vmin: 2           # intercept is positive (~2.4-5.6, 1-99% across EDF+RHD animals)
                vmax: 6
        zpcorr:
          figsize: [10, 3]
          cmap: "RdBu_r"
          norm_type: "centered"
          norm_params:
            halfrange: 1.5

# SLURM cluster configuration
#
# One block per rule, or per group of rules that share it; workflow/schemas/config.schema.yaml
# lists the keys each block takes. Every rule reads its block through
# neurodent.workflow.utils.rule_resources:
# - time is the job's time limit, the same on every attempt. war_zeitgeber and relfreq_plots
#   add a run time computed from their input WARs (seconds_per_value, seconds_per_window).
# - mem_mb is the least memory the job asks for, doubled on each retry. A rule that reads
#   WARs also computes a peak from the parquet footers of its input WARs when the job is
#   scheduled, and asks for 1.25 times that peak when it is more than mem_mb:
#       peak = 1 GB + (the largest input WAR loaded whole, or one row group and one batch of
#              it when the rule streams it) + mem_bytes_per_window * all input windows
#   A dry run shows such a size as TBD until the inputs exist.
# - retries is how many times a failed job is resubmitted. Every rule sets it, so the
#   profile's restart-times is never used.
# A --set-resources on the command line replaces what rule_resources computes for that rule,
# including the doubling on retry.
#
# The per-window rates of the per-WAR rules come from the IQSEC2 run of 23 October 2026 (28
# WARs of 8 channels, 2,322 to 115,806 windows): sacct MaxRSS of every completed job (sacct -u
# dongjp -S 2026-10-22), joined to the parquet footers of that job's input WARs. Each rate is
# the least non-negative one that keeps every one of those jobs at or under the peak above
# before the factor 1.25, rounded up to 500 bytes. The mem_mb of each per-WAR rule is the value
# it had before, kept as a floor.
cluster:
  # Its size is not computed: the rule declares no inputs to compute it from. These are the
  # IQSEC2 values, which used to be passed as --set-resources war_generation:time=12h
  # war_generation:mem_mb=80000; a --set-resources still replaces them outright.
  war_generation:
    time: "12h"
    mem_mb: 80_000
    nodes: 1
    threads: 4
    interface: null
    retries: 2

  spike_averaged_traces:
    time: "1h"
    mem_mb: 20_000
    nodes: 1
    threads: 4
    retries: 2

  war_quality_filter:
    time: "2h"
    mem_mb: 4_000
    nodes: 1
    threads: 1
    retries: 0

  # Loads its whole WAR. Its 56 completed jobs peaked at up to 48.83 GB, at most 0.98 of the
  # peak computed with no per-window rate. At 30 GB, iqsec2_80 to 83 ran out of memory; they
  # asked for 60 GB on retry and peaked at 42.1 to 48.8 GB. They now ask for 59 to 64 GB.
  diagnostic_figures:
    time: "2h"
    mem_mb: 30_000
    mem_bytes_per_window: 0
    nodes: 1
    threads: 4
    retries: 1

  # Streams its WAR. Its 28 jobs peaked at up to 3.73 GB; the rate is 4,355 rounded up.
  war_fragment_filter:
    time: "2h"
    mem_mb: 30_000
    mem_bytes_per_window: 4_500
    nodes: 1
    threads: 1
    retries: 2

  # Streams its WAR, for war_flattening, war_flattening_manual and war_flattening_lof. The
  # last two ran 56 jobs, which peaked at up to 3.70 GB; the rate is 5,674 rounded up.
  war_flattening:
    time: "2h"
    mem_mb: 30_000
    mem_bytes_per_window: 6_000
    nodes: 1
    threads: 1
    retries: 2

  # Holds one whole WAR at a time, so one core is enough. Memory and time are computed from
  # the input WARs when the job is scheduled: mem_mb is the floor and time the fixed base. The
  # rates were measured for this rule's script on all 28 IQSEC2 WARs (8 channels, 1.6 million
  # windows) and on 24 synthetic 2-channel WARs (3 million windows): the time fit reproduces
  # both runs, and the memory rate counts the whole synthetic peak per window, so many small
  # WARs are not under-sized.
  war_zeitgeber:
    time: "30m"
    mem_mb: 2_000
    mem_bytes_per_window: 3_200
    seconds_per_value: 3.4e-7
    seconds_per_window: 8.5e-4
    nodes: 1
    threads: 1
    retries: 1

  # Holds one whole WAR at a time, so one core is enough. Memory and time are computed from
  # the input WARs when the job is scheduled: mem_mb is the floor and time the fixed base. The
  # rates were measured as for war_zeitgeber above; the plots of the banded features set this
  # rule's peak when there are many windows.
  relfreq_plots:
    time: "30m"
    mem_mb: 2_000
    mem_bytes_per_window: 3_500
    seconds_per_value: 3.2e-7
    seconds_per_window: 2.1e-3
    nodes: 1
    threads: 1
    retries: 1

  ep_figures:
    time: "2h"
    mem_mb: 10_000
    nodes: 1
    threads: 4
    retries: 0

  ep_heatmaps:
    time: "2h"
    mem_mb: 10_000
    nodes: 1
    threads: 4
    retries: 0

  zeitgeber_plots:
    time: "2h"
    mem_mb: 20_000
    nodes: 1
    threads: 4
    retries: 2

  lof_evaluation:
    time: "2h"
    mem_mb: 10_000
    nodes: 1
    threads: 4
    retries: 0

  notebook:
    time: "1h"
    mem_mb: 20_000
    nodes: 1
    threads: 4
    retries: 1

  # Streams its WAR, which war_generation writes in one row group, so its peak follows the
  # WAR's whole uncompressed size. Its 28 jobs peaked at up to 7.85 GB, at most 0.96 of the
  # peak computed with no per-window rate.
  war_standardize:
    time: "1h"
    mem_mb: 20_000
    mem_bytes_per_window: 0
    nodes: 1
    threads: 1
    retries: 2

  # Streams its WAR, for war_channel_filtering_manual and war_channel_filtering_lof. Their 56
  # jobs peaked at up to 3.66 GB; the rate is 5,310 rounded up.
  war_channel_filtering:
    time: "1h"
    mem_mb: 20_000
    mem_bytes_per_window: 5_500
    nodes: 1
    threads: 1
    retries: 2

  filtering_comparison:
    time: "1h"
    mem_mb: 10_000
    nodes: 1
    threads: 4
    retries: 0
