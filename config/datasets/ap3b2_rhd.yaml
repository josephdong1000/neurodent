# AP3B2 Project - RHD Format (Raw Intan Files)
# Dataset-specific configuration overrides
# This file is deep-merged into the main config when active_dataset="ap3b2_rhd"

analysis:
  war_generation:
    # {session} = the per-day folder (the "<date>_<stamp>" after "standardEEG "); {index} = time-chunk file.
    pattern: "{data_root}/*{animal}*standardEEG {session}/{index}.rhd"
    lro_kwargs:
      extract_func: "read_intan"  # spikeinterface.extractors.read_intan
      mode: "si"
      stream_id: "0"  # Select amplifier channels (not auxiliary)

