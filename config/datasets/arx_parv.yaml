# Arx Parv - single-file dataset config (pipeline settings + inline 'samples_data').
# EDF-only cohort (Pre-Intan). Channel mapping matched to arx_rosa per Don Joseph
# (2026-06, recorded w/ Almedia): each animal = 1 REF bank (E1-8 / E9-16 / E17-24 /
# E25-32), 8 live ch, odd-pos = L. Pair order Motor, Bar(=parietal), Hippo, Visual.
# Supersedes the old Aud/Vis/Bar/Mot mirror layout (no Auditory; Almedia did bilateral
# depth hippocampus). RHD aliases (A/B/C/D) carried for parity with arx_rosa but UNUSED
# here (no Intan animals). manual_datetime = EDF header starts (verified 2026-06).
# Note: '_0_Selection{n}' files were renamed from '_Selection{n}'.
# Unknown-genotype animals (29/32/34, 30/21/31) are dropped by the base config default
# war_quality_filter.exclude_unknown_genotypes=true; add a samples.quality_filter override to keep them.

temp_directory: "/scr1/users/dongjp"

# Global defaults for all sessions (per-animal pattern/lro_kwargs live in samples_data.animals)
analysis:
  war_generation:
    pattern:
      - "{data_root}/{animal}/{index}.EDF"
    datetimes_are_start: true
    lro_kwargs:
      mode: "mne"
      extract_func: "read_raw_edf"
      multiprocess_mode: "dask"

# --- Data inventory (channel aliases + per-animal entries) -------------------------
samples_data:
  data_root: /mnt/isilon/marsh_single_unit/PythonEEG Data/Arx Parv
