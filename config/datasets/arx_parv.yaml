  # Normalize the per-animal `genotype` strings -> short grouping/plot labels (exact match;
  # each label self-aliased). Arx is X-linked + PV-Cre conditional:
  #   KO = floxed Arx (F) AND Parvcre+: males F/y;Cre+ (hemizygous) and females F/F;Cre+
  #        (homozygous) -> Arx fully deleted in PV cells.
  #   WT = everything else (controls): Cre- flox (Arx intact), Arx(wt) incl. wt;Cre+ (no
  #        floxed allele to delete), and the germline-het F/x;Cre- females (32, 388) --
  #        no Cre = no deletion, so grouped as controls (no het-KO exists in this cohort).
  GENOTYPE_MAP:
    KO:
      - KO
      - "Arx(F/y);Parvcre+"
      - "Arx(F/F);Parvcre+"
      - "Arx(F/y); cre+"
      - "Arx(F/y);Rosa(YFP/wt);Parvcre+"
    WT:
      - WT
      - "Arx(wt);Parvcre+"
      - "Arx(wt);Parvcre-"
      - "Arx(wt); cre-"
      - "Arx(wt); Parvcre(-)"
      - "Arx(F/y);Parvcre-"
      - "Arx(F/y); cre-"
      - "Arx(F/F);Parvcre-"
      - "Arx(F/x);Parvcre-"
      - "Arx(F/x); cre-"
      - "Arx(F/y);Rosa(YFP/wt);Parvcre-"
