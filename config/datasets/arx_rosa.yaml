# Arx Rosa Project - Unified Configuration for Mixed Formats
# Per-animal pattern and lro_kwargs are now specified in samples_arx_rosa.json

samples:
  samples_file: "config/samples_arx_rosa.json"
  quality_filter:
    exclude_unknown_genotypes: false  # All animals have UNKNOWN genotype (TBD)

# Global defaults for all sessions
analysis:
  war_generation:
    pattern: "{index}"  # Default pattern (overridden per animal)
    datetimes_are_start: true  # timestamps extracted from first RHD/EDF filename per session
    assume_from_number: false  # samples_arx_rosa.json aliases cover all channels
    lro_kwargs:
      mode: "si"  # Default: Use SpikeInterface backend

