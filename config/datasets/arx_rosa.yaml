# Arx Rosa - single-file dataset config (pipeline settings + inline 'samples_data').
# Channel mapping per Don Joseph email (2026-06; recorded w/ Almedia); supersedes the old
# Becca spreadsheet + Almedia MATLAB 'NewMontage'. Hemisphere L/R and the RHD ID->region
# map are BEST-GUESS (Don gave region only) - pending Almedia's electrode wiring map.
#
# EDF: 1 animal = 1 REF bank (E1-8 / E9-16 / E17-24 / E25-32), 8 live ch, odd-pos = L.
#   Pair order: Motor, Bar(=parietal), Hippo, Visual. Data-checked: 1015 = REF4 (not REF1);
#   some Vis/Bar channels run hot (artifact?) - leave to bad_channels/LOF.
# RHD: ports A/B/C, IDs {10,12,14,15,16,17,19,21}, no Aud; Don Config #2 order Bar,Mot,Vis,Hip.
#   NB the files have 16 live ch/port - the 8 selected here are provisional.
# Excluded: 1198 only (dead per spreadsheet). 3022-3024 = TAM, montage assumed = Config #2.
# Absent: Config #1 animals 1293/1306/1307 (would need per-cohort RHD mapping to add).

samples:
  quality_filter:
    exclude_unknown_genotypes: false # arx_rosa genotypes are all set (Sham/Tam/control)

# Global defaults for all sessions (per-animal pattern/lro_kwargs live in samples_data.animals)
analysis:
  war_generation:
    pattern: "{index}" # default pattern (overridden per animal)
    datetimes_are_start: true # timestamps from the first RHD/EDF filename per session
    lro_kwargs:
      mode: "si" # default: SpikeInterface backend

