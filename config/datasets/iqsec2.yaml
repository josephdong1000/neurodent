  # === DataWave bin cohorts (no rhd leg at all) ===
  #   These six animals were recorded only by the DataWave rig. They are here because they
  #   are what makes the male genotype contrast interpretable: with the rhd cohorts alone
  #   every control male falls in a 35 day window in 2020 and only one of eight mutants
  #   falls inside it, so genotype and recording date are very nearly the same variable
  #   and any difference between the groups could equally be a difference between two eras
  #   of the rig. These animals put controls in early 2019 as well, so the two groups
  #   interleave. That improves the design; it does not make it a designed experiment, and
  #   recording date is still worth carrying as a covariate.
  #   Animal 47 not loaded. Animal 47 (IQSEC 42 43 44 47/47 IQSEC2 Het Female) has only 3
  #   live bins and they do not share a montage: two declare 7 channels, missing D-021
  #   (RVis), and one declares the full 8. _validate_channel_names compares resolved
  #   abbreviations, so a 7-channel file and an 8-channel file in one animal raise rather
  #   than merge. The pattern language cannot express a per-file exclusion (skip_sessions
  #   matches on {session}, and these share one), so isolating the 8-channel file would
  #   leave the animal with a single recording. Excluded rather than fudged. It is a het
  #   female contributing about 3 hours, so it does not bear on the mutant-versus-control
  #   male contrast these bin animals were added to de-confound.
  #   Animal 51: 145 live bins, about 72 h, PortC from sheet cage 3 and confirmed by the
  #   sidecars. 8 distinct ProbeInfo spellings of the same 8 electrodes, all mapped above.
  #   No channel_subset: unlike the rhd cohorts, where one file holds four animals' ports,
  #   each bin file holds only this animal.
  - id: IQSEC2_51
    genotype: +/y
    sex: Male
    pattern:
    - "{data_root}/PythonEEG Data Bins/IQSEC2/IQSEC2 51_52/51 IQSEC2 Mut Male/{session}/Cage 3-{index}_ColMajor.bin"
