  # --- 20200609_IQSEC2_114_117_118: 4332 files, 4 sessions, 128 amp channels on A,B,C,D
  #   PortB not loaded. Animal 117, not loaded. The reference sheet is the authority here
  #   and it gives 117 no Cage, no Amp channel, no Recording Start and no Recording End,
  #   so no port assignment is derivable for it under the cage-to-port rule this config
  #   uses everywhere else; 115, its littermate, is marked Died with the same blank cells.
  #   Recorded honestly: the hardware disagrees. This port carries 7 of 8 live canonical
  #   amps, indistinguishable in quality from PortA which IS loaded, and the cohort's
  #   DataWave sidecars name their four cages Cage 1 (114), Cage 2 (117), Cage 3 (118) and
  #   Cage 4 (Empty), so the acquisition software recorded a Cage 2 animal named 117 for
  #   the full three days. That is a gap in the lab record rather than evidence the port
  #   is empty, and resolving it needs the lab, not more analysis. Two earlier
  #   justifications for this exclusion were withdrawn as false: that the 59.5 GB file
  #   named 117 is a cage video (all four cohort .ddf are the same kind of file, including
  #   those of two loaded animals), and that PortB is 92.4 percent line noise (that figure
  #   has no script, output or log behind it).
  #   PortD not loaded. Empty headstage: 0 of 8 canonical amps live, and the cohort's
  #   DataWave sidecar names this cage 'Empty'.
  #   Animal 114: 1 declared electrode(s) read at or above 5e+06 ohm in this cohort's own
  #   impedance export and are unconnected amplifier inputs, not electrodes: LHip (A-012)
  #   1.75e+07 ohm. Declared bad below. Nothing else in the pipeline would remove them:
  #   the manual channel filter is the only gate on the ep_analysis path, and LOF scores a
  #   dead channel around 1.1 against a threshold of 2.5 because its distance metric
  #   scales with amplitude.
  - id: IQSEC2_114
    genotype: x/y
    sex: Male
    channel_subset: *port_a
    bad_channels:
    - LHip
    pattern: "{data_root}/PythonEEG Data/IQSEC2/20200609_IQSEC2_114_117_118/{session}_{index}.rhd"
    lro_kwargs:
      extract_func: "read_intan"
      stream_id: "0"
      datetimes_are_start: true
      ignore_integrity_checks: true
    manual_datetime:
      20200609_IQSEC2_114_117_118_200609: '2020-06-09 08:26:31'
      20200609_IQSEC2_114_117_118_200610: '2020-06-10 00:00:34'
      20200609_IQSEC2_114_117_118_200611: '2020-06-11 00:00:35'
