    genotype: +/y
    sex: Male
    channel_subset: *port_c
    bad_channels:
    - LMot
    pattern: "{data_root}/PythonEEG Data/IQSEC2/20180917_IQSEC2_6_23/{session}_{index}.rhd"
    lro_kwargs:
      extract_func: "read_intan"
      stream_id: "0"
