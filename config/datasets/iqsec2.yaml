# IQSEC2 - adult half (Intan rhd cohorts)
#
# GENERATED by scripts/iqsec2/generate_config.py. Regenerate rather than hand-editing;
# the port map comes from 'IQSEC2 Compiled EEG data.xlsx' sheet 'EEG Reference Sheet'
# and the session start times from the rhd filenames.
#
# Ports come from the sheet's Cage column (1->A 2->B 3->C 4->D; the trailing letter
# in '3B' is the rack, not the port). Folder-name genotypes contradict the sheet and
# are NOT used. Positional assignment (folder-name order maps to A,B,C,D) is wrong in
# five cohorts because several start at cage 3, and is never used here.
#
# Pups live in a separate config: 32 ProbeInfo strings occur in both pup and adult
# cohorts and would need different abbreviations in each, which set_channel_map
# refuses. See config/datasets/iqsec2_pup.yaml.

analysis:
  war_generation:
    # Deliberately minimal: the per-animal merge is a shallow update that can override
    # but never delete, so anything reader-specific here would leak into every animal.
    pattern: "{index}.rhd"  # placeholder; every animal overrides it
    lro_kwargs:
      mode: "si"

samples_data:
  data_root: /mnt/isilon/marsh_single_unit

  # The allele notation IS the genotype vocabulary. Per the legend in the workbook's
  # 'Demographic Info' sheet, '+' is the MUTANT allele and 'x' is the wildtype X:
  #   (+/y) mutant male   (+/+) mutant female   (+/x) het female   (x/y) control male
  # Reading these by the usual convention would label 14 mutants as wildtype.
  GENOTYPE_MAP:
    Unknown: [Unknown, unknown, UNKNOWN]
    +/y: [+/y]
    x/y: [x/y]
    +/x: [+/x]
    +/+: [+/+]
    -/y: [-/y]
    x/x: [x/x]
  SEX_MAP:
    Unknown: [Unknown, unknown, UNKNOWN]
    Male: [Male, male, M, m]
    Female: [Female, female, F, f]

  # rhd exposes bare Intan ids, so the map is keyed on those. The bin half uses
  # port-prefixed ProbeInfo strings and is a different key space; it is not present
  # here because this config covers the rhd cohorts only.
  channels:
    LMot:
    - A-015
    - B-015
    - C-015
    - D-015
    RMot:
    - A-016
    - B-016
    - C-016
    - D-016
    LBar:
    - A-014
    - B-014
    - C-014
    - D-014
    RBar:
    - A-017
    - B-017
    - C-017
    - D-017
    LHip:
    - A-012
    - B-012
    - C-012
    - D-012
    RHip:
    - A-019
    - B-019
    - C-019
    - D-019
    LVis:
    - A-010
    - B-010
    - C-010
    - D-010
    RVis:
    - A-021
    - B-021
    - C-021
    - D-021

  # One anchor per port keeps each animal to a single line instead of eight.
  _ports:
    port_a: &port_a ['A-010', 'A-012', 'A-014', 'A-015', 'A-016', 'A-017', 'A-019', 'A-021']
    port_b: &port_b ['B-010', 'B-012', 'B-014', 'B-015', 'B-016', 'B-017', 'B-019', 'B-021']
    port_c: &port_c ['C-010', 'C-012', 'C-014', 'C-015', 'C-016', 'C-017', 'C-019', 'C-021']
    port_d: &port_d ['D-010', 'D-012', 'D-014', 'D-015', 'D-016', 'D-017', 'D-019', 'D-021']

