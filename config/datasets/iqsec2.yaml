# IQSEC2 - adult half (Intan rhd cohorts)
#
# GENERATED by scripts/iqsec2/generate_config.py. Regenerate rather than hand-editing;
# the port map comes from 'IQSEC2 Compiled EEG data.xlsx' sheet 'EEG Reference Sheet'
# and the session start times from the rhd filenames.
#
# Ports come from the sheet's Cage column (1->A 2->B 3->C 4->D; the trailing letter
# in '3B' is the rack, not the port). Folder-name genotypes contradict the sheet and
# are not used. Positional assignment (folder-name order maps to A,B,C,D) is wrong in
# six of the ten cohorts because several start at cage 3, and is never used here:
# 20180917, IQSEC 65_66, 013120, 012720, 20200602 and IQSEC animal 3.
#
# lro_kwargs carries ignore_integrity_checks. 49 of the 9867 rhd files hold short
# timestamp discontinuities that read_intan otherwise refuses to open, which aborts
# 10 of the 23 animals. Measured across all 49: 70 sample drops of 1 to 3 samples,
# 0.5 to 1.5 ms each at 2000 Hz, 0.0395 s total for the whole dataset. The flag
# splices them shut. Two residuals are worth knowing. The splice is not amplitude
# free: the step at the join is a median 199 uV and a worst case 6921 uV, each
# contaminating exactly one 5 s window, so at worst 0.055 percent of one animal's
# windows. And the dataset's real timeline error is elsewhere and much larger:
# 20200609_..._200609 contains a cross-file timestamp restart of 75.2 s that
# accumulates to about 109 s of drift, which no per-file check can see because neo
# validates continuity within a file only.
#
# This config covers the adult half only. The pup cohorts need their own config and
# it does not exist yet: 32 ProbeInfo strings occur in both pup and adult cohorts and
# would need different abbreviations in each, which set_channel_map refuses. That
# constraint belongs to the DataWave ProbeInfo key space; every raw name in THIS
# file is a bare Intan id, so it does not bind here.
#
# Caveat on the female arm, recorded because a figure will not show it: IQSEC2_3 is
# the only x/x animal, so it is the baseline every female difference heatmap is
# normalized against. It has no reference-sheet row, its genotype and sex are both
# assumed, its cohort has no impedance record at all, and 25 of its 142 files are
# spliced. The female arm is 7 het, 1 mutant and that 1 assumed control. The male
# contrast, 8 mutant against 6 control, is the result that stands on its own.

analysis:
  war_generation:
    # Deliberately minimal: the per-animal merge is a shallow update that can override
    # but never delete, so anything reader-specific here would leak into every animal.
    pattern: "{index}.rhd"  # placeholder; every animal overrides it
    lro_kwargs:
      mode: "si"

samples_data:
  data_root: /mnt/isilon/marsh_single_unit

  # The allele notation IS the genotype vocabulary. Per the legend in the workbook's
  # 'Demographic Info' sheet, '+' is the MUTANT allele and 'x' is the wildtype X:
  #   (+/y) mutant male   (+/+) mutant female   (+/x) het female   (x/y) control male
  # Reading these by the usual convention would label 14 mutants as wildtype.
  GENOTYPE_MAP:
    Unknown: [Unknown, unknown, UNKNOWN]
    +/y: [+/y]
    x/y: [x/y]
    +/x: [+/x]
    +/+: [+/+]
    x/x: [x/x]
  SEX_MAP:
    Unknown: [Unknown, unknown, UNKNOWN]
    Male: [Male, male, M, m]
    Female: [Female, female, F, f]

  # rhd exposes bare Intan ids, so the map is keyed on those. The bin half uses
  # port-prefixed ProbeInfo strings and is a different key space; it is not present
  # here because this config covers the rhd cohorts only.
  channels:
    LMot:
    - A-015
    - B-015
    - C-015
    - D-015
    RMot:
    - A-016
    - B-016
    - C-016
    - D-016
    LBar:
    - A-014
    - B-014
    - C-014
    - D-014
    RBar:
    - A-017
    - B-017
    - C-017
    - D-017
    LHip:
    - A-012
    - B-012
    - C-012
    - D-012
    RHip:
    - A-019
    - B-019
    - C-019
    - D-019
    LVis:
    - A-010
    - B-010
    - C-010
    - D-010
    RVis:
    - A-021
    - B-021
    - C-021
    - D-021

  # One anchor per port keeps each animal to a single line instead of eight.
  _ports:
    port_a: &port_a ['A-010', 'A-012', 'A-014', 'A-015', 'A-016', 'A-017', 'A-019', 'A-021']
    port_b: &port_b ['B-010', 'B-012', 'B-014', 'B-015', 'B-016', 'B-017', 'B-019', 'B-021']
    port_c: &port_c ['C-010', 'C-012', 'C-014', 'C-015', 'C-016', 'C-017', 'C-019', 'C-021']
    port_d: &port_d ['D-010', 'D-012', 'D-014', 'D-015', 'D-016', 'D-017', 'D-019', 'D-021']

  animals:
  # --- 20180917_IQSEC2_6_23: 4328 files, 4 sessions, 64 amp channels on C,D
  #   Animal 6: 1 declared electrode(s) read at or above 5e+06 ohm in this cohort's own
  #   impedance export and are unconnected amplifier inputs, not electrodes: LMot (C-015)
  #   1.43e+07 ohm. Declared bad below. Nothing else in the pipeline would remove them:
  #   the manual channel filter is the only gate on the ep_analysis path, and LOF scores a
  #   dead channel around 1.1 against a threshold of 2.5 because its distance metric
  #   scales with amplitude.
  - id: IQSEC2_6
    genotype: +/y
    sex: Male
    channel_subset: *port_c
    bad_channels:
    - LMot
    pattern: "{data_root}/PythonEEG Data/IQSEC2/20180917_IQSEC2_6_23/{session}_{index}.rhd"
    lro_kwargs:
      extract_func: "read_intan"
      stream_id: "0"
      datetimes_are_start: true
      ignore_integrity_checks: true
    manual_datetime:
      20180917_IQSEC2_6_23_180917: '2018-09-17 09:11:56'
      20180917_IQSEC2_6_23_180918: '2018-09-18 00:00:57'
      20180917_IQSEC2_6_23_180919: '2018-09-19 00:00:57'
      20180917_IQSEC2_6_23_180920: '2018-09-20 00:00:58'
  - id: IQSEC2_23
    genotype: +/+
    sex: Female
    channel_subset: *port_d
    pattern: "{data_root}/PythonEEG Data/IQSEC2/20180917_IQSEC2_6_23/{session}_{index}.rhd"
    lro_kwargs:
      extract_func: "read_intan"
      stream_id: "0"
      datetimes_are_start: true
      ignore_integrity_checks: true
    manual_datetime:
      20180917_IQSEC2_6_23_180917: '2018-09-17 09:11:56'
      20180917_IQSEC2_6_23_180918: '2018-09-18 00:00:57'
      20180917_IQSEC2_6_23_180919: '2018-09-19 00:00:57'
      20180917_IQSEC2_6_23_180920: '2018-09-20 00:00:58'
  # --- IQSEC 56 57 60 61: 145 files, 4 sessions, 128 amp channels on A,B,C,D
  - id: IQSEC2_56
    genotype: +/x
    sex: Female
    channel_subset: *port_a
