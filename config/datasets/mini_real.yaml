# Mini Real Dataset — small committed bin/csv recordings for smoke testing
# Usage: NEURODENT_DATASET=mini_real snakemake --cores all

temp_directory: "/tmp/neurodent_mini_real"

analysis:
  war_generation:
    pattern:
      - "{data_root}/{animal}/{index}_ColMajor.bin"
      - "{data_root}/{animal}/{index}_Meta.csv"
    lro_kwargs:
      mode: "si"
      extract_func: "neurodent.readers:read_bin_csv_pair"
      multiprocess_mode: "serial"

cluster:
  war_generation:
    retries: 0

# --- Data inventory (channels + per-animal entries) ---
samples_data:
  data_root: .tests/integration/data
  channels:
    # Exact channel names as the readers present them. read_bin_csv_pair keys identity
    # on the ProbeInfo column, which this fixture keeps short and port-qualified by the
    # channel id itself (the 'C' in C-015 IS the port). Real DataWave exports prefix
    # these with 'Intan Input (1)/PortC ', which adds length but no information; see
    # sox5_bin.yaml for a map against unmodified export names.
    LMot:
    - C-015
    - D-015
    RMot:
    - C-016
    - D-016
    LBar:
    - C-014
    - D-014
    RBar:
    - C-017
    - D-017
    LHip:
    - C-012
    - D-012
    RHip:
    - C-019
    - D-019
    LAud:
    - C-009
    - D-009
    RAud:
    - C-022
    - D-022
    LVis:
    - C-010
    - D-010
    RVis:
    - C-021
    - D-021
  animals:
  - id: A10
    sex: M
    genotype: WT
    manual_datetime: '2025-05-10 10:00:00'
  - id: F22
    sex: F
    genotype: KO
    manual_datetime: '2025-05-10 10:00:00'
