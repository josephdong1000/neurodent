$schema: "https://json-schema.org/draft/2020-12/schema"
# TODO: This schema is a work in progress and should be extended to cover
# all supported configuration keys as the pipeline evolves.
description: Configuration schema for the neurodent Snakemake pipeline
type: object
required:
  - temp_directory
  - samples
  - analysis
properties:
  temp_directory:
    type: string
    description: Path to temporary directory for intermediate files
  active_dataset:
    type: string
    description: Name of the active dataset configuration
  samples_data:
    type: object
    description: >-
      Inline samples inventory (data_root, channel aliases, animals) for
      single-file datasets. Alternative to 'samples.samples_file'.
  samples:
    type: object
    properties:
      samples_file:
        type: string
        description: >-
          Path to an external samples inventory (.json/.yaml). Two-file datasets
          use this; single-file datasets inline the inventory under top-level
          'samples_data' instead.
      truncate_animals:
        description: Limit to first N animals (null for no limit)
        type: ["integer", "null"]
      quality_filter:
        type: object
        properties:
          exclude_unknown_genotypes:
            type: boolean
          exclude_bad_animaldays:
            type: boolean
  analysis:
    type: object
    description: Analysis parameters
    properties:
      war_generation:
        type: object
        description: WAR generation parameters
        properties:
          compute_windowed_analysis:
            type: object
            description: Parameters forwarded to AnimalOrganizer.compute_windowed_analysis()
            properties:
              features:
                type: array
                description: Features to compute. Use ["all"] for all supported features.
                items:
                  type: string
              multiprocess_mode:
                type: string
                description: "'dask' for parallel computation or 'serial' for single-threaded"
                enum: ["dask", "serial"]
              chunk_duration_s:
                description: >
                  Duration in seconds of data to buffer in RAM at one time when
                  streaming to zarr. null = allocate all fragments at once (high
                  throughput, high RAM). Set to a number (e.g. 250) to cap peak
                  RAM use. Only has an effect when multiprocess_mode is "dask".
                type: ["number", "null"]
      frequency_domain_spike_detection:
        type: object
        description: Spike detection parameters
        properties:
          chunk_duration_s:
            description: >
              Duration in seconds of each processing chunk for spike detection.
              The full recording is always analysed; this parameter controls
              peak RAM by processing overlapping chunks of the given duration.
              null = load the full recording at once (fastest, highest RAM).
            type: ["number", "null"]
          export_chunk_duration_s:
            type: number
            description: >
              Duration in seconds of each chunk read when exporting traces to
              .fif files. Smaller values reduce peak RAM during export.
          spike_averaged_traces:
            type: object
            description: Parameters for spike-averaged trace plots and epoch exports
            properties:
              tmin:
                type: number
                description: Epoch start time relative to spike (seconds)
              tmax:
                type: number
                description: Epoch end time relative to spike (seconds)
              baseline:
                description: Baseline correction window [tmin, tmax] or null
                type: ["array", "null"]
              save_epochs:
                type: boolean
                description: Whether to save epoch data as .fif files
              figure_format:
                type: string
                description: Output format for spike-averaged-trace figures
              dpi:
                type: integer
                description: Figure resolution in dots per inch
      channel_filter_config:
        type: object
        description: Channel filtering configurations
        properties:
          lof:
            type: object
            description: LOF-based bad channel detection parameters
            properties:
              reject_lof_threshold:
                type: number
                description: LOF score threshold above which channels are considered bad
              lof_chunk_duration_s:
                type: number
                description: >
                  Duration in seconds of each chunk used for pairwise-distance
                  computation in LOF bad-channel detection.  Lower values reduce
                  peak RAM at the cost of more I/O passes over the recording.
  cluster:
    type: object
    description: >-
      SLURM resources of each rule, one block per rule or group of rules, read by
      neurodent.workflow.utils.rule_resources. A block takes only the keys its rules read, so
      an unknown block or key is refused rather than silently ignored.
    additionalProperties: false
    required:
      - war_generation
      - spike_averaged_traces
      - war_quality_filter
      - diagnostic_figures
      - war_fragment_filter
      - war_flattening
      - war_zeitgeber
      - relfreq_plots
      - ep_figures
      - ep_heatmaps
      - zeitgeber_plots
      - lof_evaluation
      - notebook
      - war_standardize
      - war_channel_filtering
      - filtering_comparison
    properties:
      war_generation:
        $ref: "#/$defs/dask_cluster_block"
      spike_averaged_traces:
        $ref: "#/$defs/cluster_block"
      war_quality_filter:
        $ref: "#/$defs/cluster_block"
      diagnostic_figures:
        $ref: "#/$defs/war_sized_cluster_block"
      war_fragment_filter:
        $ref: "#/$defs/war_sized_cluster_block"
      war_flattening:
        $ref: "#/$defs/war_sized_cluster_block"
      war_zeitgeber:
        $ref: "#/$defs/war_timed_cluster_block"
      relfreq_plots:
        $ref: "#/$defs/war_timed_cluster_block"
      ep_figures:
        $ref: "#/$defs/cluster_block"
      ep_heatmaps:
        $ref: "#/$defs/cluster_block"
      zeitgeber_plots:
        $ref: "#/$defs/cluster_block"
      lof_evaluation:
        $ref: "#/$defs/cluster_block"
      notebook:
        $ref: "#/$defs/cluster_block"
      war_standardize:
        $ref: "#/$defs/war_sized_cluster_block"
      war_channel_filtering:
        $ref: "#/$defs/war_sized_cluster_block"
      filtering_comparison:
        $ref: "#/$defs/cluster_block"

$defs:
  time:
    type: string
    description: >-
      Time limit as the SLURM profile accepts it, for example "2h", "30m" or "1h30m". The
      same limit applies to every attempt.
  mem_mb:
    type: integer
    minimum: 1
    description: >-
      Least memory the job asks for, in MB, doubled on each retry. A rule sized from its
      input WARs asks for more when they need it.
  nodes:
    type: integer
    minimum: 1
  threads:
    type: integer
    minimum: 1
  retries:
    type: integer
    minimum: 0
    description: >-
      Times a failed job is resubmitted. Every rule sets it, so the profile's restart-times is
      never used.
  cluster_block:
    type: object
    description: Resources of a rule whose size does not depend on its inputs.
    additionalProperties: false
    required: [time, mem_mb, nodes, threads, retries]
    properties:
      time: {$ref: "#/$defs/time"}
      mem_mb: {$ref: "#/$defs/mem_mb"}
      nodes: {$ref: "#/$defs/nodes"}
      threads: {$ref: "#/$defs/threads"}
      retries: {$ref: "#/$defs/retries"}
  dask_cluster_block:
    type: object
    description: Resources of war_generation, which also starts a local Dask cluster.
    additionalProperties: false
    required: [time, mem_mb, nodes, threads, retries, interface]
    properties:
      time: {$ref: "#/$defs/time"}
      mem_mb: {$ref: "#/$defs/mem_mb"}
      nodes: {$ref: "#/$defs/nodes"}
      threads: {$ref: "#/$defs/threads"}
      retries: {$ref: "#/$defs/retries"}
      interface:
        type: ["string", "null"]
        description: Network interface for the Dask cluster, or null for the default.
  war_sized_cluster_block:
    type: object
    description: Resources of a rule whose memory is computed from its input WARs.
    additionalProperties: false
    required: [time, mem_mb, nodes, threads, retries, mem_bytes_per_window]
    properties:
      time: {$ref: "#/$defs/time"}
      mem_mb: {$ref: "#/$defs/mem_mb"}
      nodes: {$ref: "#/$defs/nodes"}
      threads: {$ref: "#/$defs/threads"}
      retries: {$ref: "#/$defs/retries"}
      mem_bytes_per_window:
        type: number
        minimum: 0
        description: >-
          Bytes the rule's script keeps or builds per input window, on top of what it holds
          of the largest input WAR.
  war_timed_cluster_block:
    type: object
    description: Resources of a rule whose memory and time are computed from its input WARs.
    additionalProperties: false
    required:
      - time
      - mem_mb
      - nodes
      - threads
      - retries
      - mem_bytes_per_window
      - seconds_per_value
      - seconds_per_window
    properties:
      time: {$ref: "#/$defs/time"}
      mem_mb: {$ref: "#/$defs/mem_mb"}
      nodes: {$ref: "#/$defs/nodes"}
      threads: {$ref: "#/$defs/threads"}
      retries: {$ref: "#/$defs/retries"}
      mem_bytes_per_window:
        type: number
        minimum: 0
        description: >-
          Bytes the rule's script keeps or builds per input window, on top of the largest
          input WAR loaded whole.
      seconds_per_value:
        type: number
        minimum: 0
        description: Run time per stored value of the input WARs, added to time.
      seconds_per_window:
        type: number
        minimum: 0
        description: Run time per window of the input WARs, added to time.
